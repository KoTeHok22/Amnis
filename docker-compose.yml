services:
  freellm:
    build:
      context: ./freeLLM
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    environment:
      - HOST=0.0.0.0
      - PORT=11434
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dream_interpreter}
      POSTGRES_USER: ${POSTGRES_USER:-Amnis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Amnis0987}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-Amnis} -d ${POSTGRES_DB:-dream_interpreter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "redis.jdh-team.ru:host-gateway"

  backend:
    build:
      context: ./BACK
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: >
      sh -c "celery -A celery_app worker --loglevel=info --concurrency=2 &
             python startup_with_retry.py"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://Amnis:Amnis0987@db:5432/dream_interpreter}
      - SECRET_KEY=8079cd21663b08a5d47c014849a28becd07ef7ee84c8585918fcc8a0509cc1224fbbd8769e340a4af4ee0c16940d0523b25686f1
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://freellm:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-free}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen3.6-plus}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://amnis.jdh-team.ru,http://amnis.jdh-team.ru,http://localhost:3891,http://127.0.0.1:3891,http://localhost:8000,http://127.0.0.1:8000}
      - NICEPAY_MERCHANT_ID=${NICEPAY_MERCHANT_ID}
      - NICEPAY_SECRET_KEY=${NICEPAY_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://amnis.jdh-team.ru}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./BACK:/app
    restart: unless-stopped
    extra_hosts:
      - "redis.jdh-team.ru:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./UI
      dockerfile: Dockerfile
    ports:
      - "3891:80"
    depends_on:
      - backend
    extra_hosts:
      - "api.jdh-team.ru:host-gateway"

volumes:
  postgres_data:
