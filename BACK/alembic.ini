[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# max_length = 40

# version number format object applied to the
# revision id objects
# version_num_separator = .

# version path separator; As mentioned above, this is assumed to be "/".
# However, this can be changed to any character.
# version_path_separator = /

# version path separator; As mentioned above, this is assumed to be "/".
# However, this can be changed to any character.
# Valid values for version_path_separator are:
#   version_path_separator = /
#   version_path_separator = .
#   version_path_separator = +
#   version_path_separator = -

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# if this is set to 'true', and autogenerate is enabled,
# allow comparison of the script to the version table
# without later stamping the version table
# version_table_bypass_autogen = false

# if this is set to 'true', and autogenerate is enabled,
# individual migration scripts will attempt to check if they're
# already present in the migration directory before writing
# version_path_ensure_uptodate = true

# set to 'true' to run the environment during
# the 'downgrade' command
# downgrade_refresh_reflection = false

# set to 'true' to include symbols which are marked as
# not existing in the source in the autogenerate comparison.
# 'default' alone will not include them, 'all' will include all
# symbols, 'manual' will cause the include_object() hook to be
# called for each one.
# include_name = default

# Spécifie l'URL de la base de données
sqlalchemy.url = postgresql://Amnis:Amnis0987@db:5432/dream_interpreter


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S